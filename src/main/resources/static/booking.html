<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details — RailGo</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<header class="topbar">
    <a href="index.html" class="brand">
        <span class="brand-dot"></span>
        RailGo
    </a>
    <nav class="topnav" id="topnav"></nav>
</header>

<section class="page">
    <div id="selectedTrainBox"></div>

    <div class="panel" id="passengerPanel">
        <div class="panel-title">Passenger Details</div>
        <form id="bookingForm">
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="pName" placeholder="Passenger name" required>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="field">
                    <label>Age</label>
                    <input type="number" id="pAge" min="1" max="120" placeholder="25" required>
                </div>
                <div class="field">
                    <label>Gender</label>
                    <select id="pGender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Phone</label>
                <input type="tel" id="pPhone" placeholder="9876543210" required>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="pEmail" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
        </form>
    </div>

    <div id="bookingResult"></div>
</section>

<script src="app.js"></script>
</body>
</html>
