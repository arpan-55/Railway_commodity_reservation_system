<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcel Booking — RailGo</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<header class="topbar">
    <a href="index.html" class="brand">
        <span class="brand-dot"></span>
        RailGo
    </a>
    <nav class="topnav" id="topnav"></nav>
</header>

<section class="page">
    <div class="panel" id="parcelPanel">
        <div class="panel-title">Parcel / Cargo Booking</div>
        <form id="parcelForm">

            <p style="font-size:13px; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:1px;">Sender</p>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="field">
                    <label>Name</label>
                    <input type="text" id="sName" placeholder="Sender name" required>
                </div>
                <div class="field">
                    <label>Phone</label>
                    <input type="tel" id="sPhone" placeholder="9876543210" required>
                </div>
            </div>

            <p style="font-size:13px; color:var(--muted); margin:12px 0; text-transform:uppercase; letter-spacing:1px;">Receiver</p>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="field">
                    <label>Name</label>
                    <input type="text" id="rName" placeholder="Receiver name" required>
                </div>
                <div class="field">
                    <label>Phone</label>
                    <input type="tel" id="rPhone" placeholder="9876543210" required>
                </div>
            </div>

            <p style="font-size:13px; color:var(--muted); margin:12px 0; text-transform:uppercase; letter-spacing:1px;">Shipment</p>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="field">
                    <label>From</label>
                    <input type="text" id="pFrom" placeholder="Kolkata" required>
                </div>
                <div class="field">
                    <label>To</label>
                    <input type="text" id="pTo" placeholder="Delhi" required>
                </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="field">
                    <label>Parcel Type</label>
                    <select id="pType" required>
                        <option value="">Select</option>
                        <option value="Documents">Documents</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Food">Food Items</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field">
                    <label>Weight (kg)</label>
                    <input type="number" id="pWeight" min="0.1" step="0.1" placeholder="5" required>
                </div>
            </div>
            <div class="field">
                <label>Journey Date</label>
                <input type="date" id="pDate" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Reserve Parcel</button>
        </form>
    </div>

    <div id="parcelResult"></div>
</section>

<script src="app.js"></script>
</body>
</html>
