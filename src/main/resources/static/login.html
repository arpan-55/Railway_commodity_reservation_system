<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — RailGo</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<header class="topbar">
    <a href="index.html" class="brand">
        <span class="brand-dot"></span>
        RailGo
    </a>
    <nav class="topnav" id="topnav"></nav>
</header>

<section class="page narrow">
    <div class="panel">
        <div class="panel-title">Sign In</div>
        <form id="loginForm">
            <div class="field">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="john@example.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <div class="divider"></div>
        <p class="text-center" style="font-size:13px; color:var(--muted);">
            No account? <a href="register.html" class="link">Create one</a>
        </p>
    </div>
</section>

<script src="app.js"></script>
</body>
</html>
